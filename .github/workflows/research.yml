name: research
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python research.py 2>&1 | tee research.txt
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add research.txt && git commit -m "research" && git pull --rebase && git push
