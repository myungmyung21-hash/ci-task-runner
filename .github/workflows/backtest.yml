name: backtest
on:
  workflow_dispatch:
    inputs:
      days:
        default: "30"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python monitor.py backtest ${{ github.event.inputs.days }} 2>&1 | tee backtest.txt
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: save result
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add backtest.txt && git commit -m "backtest result" && git pull --rebase && git push
