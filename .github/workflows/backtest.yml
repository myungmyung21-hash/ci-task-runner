name: backtest
on:
  workflow_dispatch:
    inputs:
      days:
        default: "30"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python monitor.py backtest ${{ github.event.inputs.days }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
