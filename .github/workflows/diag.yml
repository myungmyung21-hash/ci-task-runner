name: diag
on:
  workflow_dispatch:
    inputs:
      sym:
        default: "PEPE"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python diag.py ${{ github.event.inputs.sym }} 16 2>&1 | tee diag.txt
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add diag.txt && git commit -m "diag" && git pull --rebase && git push
